<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Chat App</title>
<style>
  body { background-color: #e8f4f8; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .container { width: 420px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); padding: 20px; }
  .box { display: none; flex-direction: column; gap: 10px; }
  .active { display: flex; }
  input, button { padding: 8px; border-radius: 6px; border: 1px solid #ccc; outline: none; }
  button { background-color: #00bcd4; color: white; border: none; cursor: pointer; transition: 0.2s; }
  button:hover { background-color: #0198a9; }
  .link-btn { background: none; border: none; color: #00bcd4; cursor: pointer; padding: 0; text-align: left; }
  #chatContainer { height: 250px; overflow-y: auto; border: 1px solid #ccc; padding: 5px; margin-top: 10px; border-radius: 6px; }
  .message { padding: 5px; border-radius: 6px; margin: 3px 0; word-wrap: break-word; }
  .sender { background-color: #a5f3fc; align-self: flex-start; }
  .receiver { background-color: #fbcfe8; align-self: flex-end; }
</style>
</head>
<body>
<div class="container">

  <!-- Signup -->
  <div class="box active" id="signupBox">
    <h3>Create Account</h3>
    <input type="text" id="signupUserId" placeholder="User ID" />
    <input type="password" id="signupPassword" placeholder="Password" />
    <button id="signupBtn">Sign Up</button>
    <button class="link-btn" id="goToLogin">Already have an account? Login</button>
  </div>

  <!-- Login -->
  <div class="box" id="loginBox">
    <h3>Login</h3>
    <input type="text" id="loginUserId" placeholder="User ID" />
    <input type="password" id="loginPassword" placeholder="Password" />
    <button id="loginBtn">Login</button>
    <button class="link-btn" id="goToSignup">Create new account</button>
  </div>

  <!-- Chat -->
  <div class="box" id="chatBox">
    <h3 id="currentUserLabel"></h3>
    <div id="chatContainer"></div>
    <div style="display:flex;gap:5px;margin-top:5px;">
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
    </div>
    <button id="logoutBtn" style="margin-top:10px;">Logout</button>
  </div>
</div>

<script type="module">
  // Firebase imports
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getDatabase, ref, set, push, onValue, get, child } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-analytics.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDwiJVuByaincxun8h-uNgVQ0wwEiig3I8",
    authDomain: "chatapp-11789.firebaseapp.com",
    databaseURL: "https://chatapp-11789-default-rtdb.firebaseio.com",
    projectId: "chatapp-11789",
    storageBucket: "chatapp-11789.firebasestorage.app",
    messagingSenderId: "82260267373",
    appId: "1:82260267373:web:f5e51e1ecb95ba98b74a64",
    measurementId: "G-SCSHS5X2XS"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getDatabase(app);

  // DOM Elements
  const signupBox = document.getElementById("signupBox");
  const loginBox = document.getElementById("loginBox");
  const chatBox = document.getElementById("chatBox");
  const signupUserId = document.getElementById("signupUserId");
  const signupPassword = document.getElementById("signupPassword");
  const loginUserId = document.getElementById("loginUserId");
  const loginPassword = document.getElementById("loginPassword");
  const signupBtn = document.getElementById("signupBtn");
  const loginBtn = document.getElementById("loginBtn");
  const goToLogin = document.getElementById("goToLogin");
  const goToSignup = document.getElementById("goToSignup");
  const logoutBtn = document.getElementById("logoutBtn");
  const currentUserLabel = document.getElementById("currentUserLabel");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const chatContainer = document.getElementById("chatContainer");

  let currentUser = null;

  // Signup
  signupBtn.addEventListener("click", async () => {
    const id = signupUserId.value.trim();
    const pass = signupPassword.value.trim();
    if (!id || !pass) return alert("Enter details");
    const dbRef = ref(db);
    const snapshot = await get(child(dbRef, `users/${id}`));
    if (snapshot.exists()) return alert("User exists!");
    await set(ref(db, `users/${id}`), { password: pass });
    alert("Account created! Login now.");
    signupBox.classList.remove("active");
    loginBox.classList.add("active");
  });

  // Login
  loginBtn.addEventListener("click", async () => {
    const id = loginUserId.value.trim();
    const pass = loginPassword.value.trim();
    if (!id || !pass) return alert("Enter details");
    const snapshot = await get(ref(db, `users/${id}`));
    if (!snapshot.exists() || snapshot.val().password !== pass) return alert("Invalid credentials!");
    currentUser = id;
    currentUserLabel.textContent = "Logged in as: " + currentUser;
    loginBox.classList.remove("active");
    chatBox.classList.add("active");
    loadChat();
  });

  logoutBtn.addEventListener("click", () => {
    currentUser = null;
    chatBox.classList.remove("active");
    loginBox.classList.add("active");
    chatContainer.innerHTML = "";
  });

  goToLogin.addEventListener("click", () => { signupBox.classList.remove("active"); loginBox.classList.add("active"); });
  goToSignup.addEventListener("click", () => { loginBox.classList.remove("active"); signupBox.classList.add("active"); });

  // Chat send
  sendBtn.addEventListener("click", async () => {
    const text = messageInput.value.trim();
    if (!currentUser) return alert("Login first!");
    if (!text) return;
    await push(ref(db, "messages"), { sender: currentUser, text: text, timestamp: Date.now() });
    messageInput.value = "";
  });

  // Load messages in real-time
  function loadChat() {
    const messagesRef = ref(db, "messages");
    onValue(messagesRef, (snapshot) => {
      chatContainer.innerHTML = "";
      const data = snapshot.val() || {};
      Object.values(data).forEach(msg => {
        const div = document.createElement("div");
        div.classList.add("message", msg.sender === currentUser ? "receiver" : "sender");
        div.innerHTML = `<b>${msg.sender}:</b> ${msg.text}`;
        chatContainer.appendChild(div);
      });
      chatContainer.scrollTop = chatContainer.scrollHeight;
    });
  }
</script>
</body>
</html>
