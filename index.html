<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Chat App (Firebase Prototype)</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-analytics.js"></script>

<style>
  body {
    background-color: #e8f4f8;
    font-family: Arial, sans-serif;
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    width: 420px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    padding: 20px;
  }
  .login-box, .signup-box, .chat-box {
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .active { display: flex; }
  input, button {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    outline: none;
  }
  input:focus { border-color: #00bcd4; }
  button {
    background-color: #00bcd4;
    color: white;
    border: none;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background-color: #0198a9; }
  .chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
  }
  .messages {
    overflow-y: auto;
    height: 300px;
    display: flex;
    flex-direction: column;
    margin-top: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 8px;
    margin: 5px 0;
    border-radius: 10px;
    word-wrap: break-word;
  }
  .sender { background-color: #a5f3fc; align-self: flex-start; }
  .receiver { background-color: #fbcfe8; align-self: flex-end; }
  .chat-input {
    display: flex;
    gap: 5px;
    margin-top: 10px;
  }
  .chat-input input[type="text"] { flex: 1; }
  .link-btn {
    color: #00bcd4;
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
    padding: 0;
  }
  .chat-top {
    text-align: center;
    background: #f0f9ff;
    padding: 6px;
    border-radius: 8px;
    font-weight: bold;
    margin-top: 5px;
  }
</style>
</head>
<body>
<div class="container">

  <!-- Signup -->
  <div class="signup-box active" id="signupBox">
    <h3>Create Account</h3>
    <input type="email" id="signupEmail" placeholder="Email" />
    <input type="password" id="signupPassword" placeholder="Password" />
    <button id="signupBtn">Sign Up</button>
    <button class="link-btn" id="goToLogin">Already have an account? Login</button>
  </div>

  <!-- Login -->
  <div class="login-box" id="loginBox">
    <h3>Login</h3>
    <input type="email" id="loginEmail" placeholder="Email" />
    <input type="password" id="loginPassword" placeholder="Password" />
    <button id="loginBtn">Login</button>
    <button class="link-btn" id="goToSignup">Create new account</button>
  </div>

  <!-- Chat -->
  <div class="chat-box" id="chatBox">
    <div class="chat-header">
      <span id="currentUser"></span>
      <button id="logoutBtn">Logout</button>
    </div>

    <div class="chat-top">
      <input type="email" id="chatWithInput" placeholder="Enter friend email" />
      <button id="startChatBtn">Start Chat</button>
    </div>

    <div id="chatContainer" class="messages"></div>

    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDwiJVuByaincxun8h-uNgVQ0wwEiig3I8",
    authDomain: "chatapp-11789.firebaseapp.com",
    databaseURL: "https://chatapp-11789-default-rtdb.firebaseio.com",
    projectId: "chatapp-11789",
    storageBucket: "chatapp-11789.firebasestorage.app",
    messagingSenderId: "82260267373",
    appId: "1:82260267373:web:f5e51e1ecb95ba98b74a64",
    measurementId: "G-SCSHS5X2XS"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  // UI elements
  const signupBox = document.getElementById("signupBox");
  const loginBox = document.getElementById("loginBox");
  const chatBox = document.getElementById("chatBox");
  const signupEmail = document.getElementById("signupEmail");
  const signupPassword = document.getElementById("signupPassword");
  const loginEmail = document.getElementById("loginEmail");
  const loginPassword = document.getElementById("loginPassword");
  const signupBtn = document.getElementById("signupBtn");
  const loginBtn = document.getElementById("loginBtn");
  const goToLogin = document.getElementById("goToLogin");
  const goToSignup = document.getElementById("goToSignup");
  const logoutBtn = document.getElementById("logoutBtn");
  const currentUserLabel = document.getElementById("currentUser");
  const chatContainer = document.getElementById("chatContainer");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const chatWithInput = document.getElementById("chatWithInput");
  const startChatBtn = document.getElementById("startChatBtn");

  let currentUser = null;
  let activeChatUser = null;

  // Switch between boxes
  goToLogin.onclick = () => { signupBox.classList.remove("active"); loginBox.classList.add("active"); };
  goToSignup.onclick = () => { loginBox.classList.remove("active"); signupBox.classList.add("active"); };

  // Sign up
  signupBtn.onclick = () => {
    const email = signupEmail.value.trim();
    const password = signupPassword.value.trim();
    auth.createUserWithEmailAndPassword(email, password)
      .then(() => {
        alert("Account created!");
        signupBox.classList.remove("active");
        loginBox.classList.add("active");
      })
      .catch(err => alert(err.message));
  };

  // Login
  loginBtn.onclick = () => {
    const email = loginEmail.value.trim();
    const password = loginPassword.value.trim();
    auth.signInWithEmailAndPassword(email, password)
      .then(userCred => {
        currentUser = userCred.user.email.replace('.', '_');
        currentUserLabel.textContent = "Logged in as: " + userCred.user.email;
        loginBox.classList.remove("active");
        chatBox.classList.add("active");
      })
      .catch(err => alert(err.message));
  };

  // Logout
  logoutBtn.onclick = () => {
    auth.signOut();
    currentUser = null;
    chatBox.classList.remove("active");
    loginBox.classList.add("active");
  };

  // Start chat with another email
  startChatBtn.onclick = () => {
    activeChatUser = chatWithInput.value.trim().replace('.', '_');
    if (!activeChatUser) return alert("Enter email to chat with!");
    chatContainer.innerHTML = "";
    loadChat();
  };

  // Send message
  sendBtn.onclick = () => {
    const text = messageInput.value.trim();
    if (!text || !activeChatUser) return;
    const chatId = [currentUser, activeChatUser].sort().join("_");
    db.ref("chats/" + chatId).push({
      sender: currentUser,
      text,
      timestamp: Date.now()
    });
    messageInput.value = "";
  };

  // Load chat in real-time
  function loadChat() {
    const chatId = [currentUser, activeChatUser].sort().join("_");
    db.ref("chats/" + chatId).on("child_added", snap => {
      const msg = snap.val();
      displayMessage(msg);
    });
  }

  function displayMessage(msg) {
    const div = document.createElement("div");
    div.classList.add("msg", msg.sender === currentUser ? "receiver" : "sender");
    div.textContent = msg.text;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }
</script>
</body>
</html>
